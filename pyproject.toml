[project]
name = "storydesk"
version = "0.1.0"
description = "NBL Storyline Desk: a Claude Agent SDK multi-agent research and collaboration layer for NBL media (demo)."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.127",
    "mcp>=1.10",
    "duckdb>=1.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "jsonschema>=4"]

[project.scripts]
storydesk = "storydesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storydesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: needs a real Claude run on Bart's login; never run by an unattended loop",
    "live_data: checks the mutable published data snapshot; excluded until the live copy pass",
]
addopts = "-m 'not live and not live_data'"
asyncio_mode = "auto"
